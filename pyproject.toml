[project]
name = "isokit"
version = "0.1.0"
description = "Guarded generator for Azure-style isometric architecture diagrams as SVG"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Micah B" }]
keywords = ["isometric", "diagram", "svg", "architecture", "azure"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/zeiosmb/isokit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isokit"]
